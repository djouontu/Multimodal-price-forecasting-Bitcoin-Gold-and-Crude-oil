[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal_forecaster"
version = "1.0.0"
description = "Reliable Multimodal Stock Prediction Framework under Missing or Sparse Modalities"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "pandas",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
